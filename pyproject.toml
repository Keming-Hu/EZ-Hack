[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ez-hack"
version = "0.2.0"
description = "A lightweight host/operator collaboration extension for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2.0,<3.0",
  "pydantic>=2.12,<3.0",
]

[project.scripts]
ez-hack = "ez_hack.cli:main"
ez-hack-server = "ez_hack.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
